name: labpartner
description: "LabPartner — plataforma B2B de cotações de química fina para representantes universitários."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend / Auth
  supabase_flutter: ^2.8.0

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegação
  go_router: ^14.6.0

  # Modelos imutáveis + serialização
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI / formatação
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # Geração de código (Freezed, json_serializable, Riverpod)
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  # Quando adicionar assets (logo, ícones), declare aqui:
  # assets:
  #   - assets/images/
